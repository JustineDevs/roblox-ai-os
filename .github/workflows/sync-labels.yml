name: Sync Labels

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - .github/labels.yml
      - .github/workflows/sync-labels.yml

permissions:
  contents: read
  issues: write

jobs:
  sync-labels:
    name: Sync issue labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync labels from repository config
        uses: crazy-max/ghaction-github-labeler@v5
        with:
          yaml-file: .github/labels.yml
