name: RCS CI

on:
  push:
    branches: [main, dev, experimental/dev]
  pull_request:
    branches: [main, dev, experimental/dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustfmt:
    name: Rust Format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all --check

  clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run check:no-unused

  build-dist:
    name: Build dist artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload prebuilt dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-dist-node20
          path: dist/
          if-no-files-found: error

  test:
    name: Test (Node ${{ matrix.node-version }} / ${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build-dist]
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 20
            lane: team-state-runtime
            test-roots: >-
              dist/team/__tests__
              dist/state/__tests__
              dist/forge/__tests__
              dist/blueprint/__tests__
              dist/runtime/__tests__
            catalog-check: false
          - node-version: 20
            lane: hooks-notify-platform
            test-roots: >-
              dist/hooks/__tests__
              dist/hooks/code-simplifier/__tests__
              dist/hooks/extensibility/__tests__
              dist/notifications/__tests__
              dist/mcp/__tests__
              dist/hud/__tests__
              dist/verification/__tests__
              dist/openclaw/__tests__
            catalog-check: false
          - node-version: 20
            lane: cli-core-rest
            test-roots: >-
              dist/cli/__tests__
              dist/agents/__tests__
              dist/autoresearch/__tests__
              dist/catalog/__tests__
              dist/compat/__tests__
              dist/config/__tests__
              dist/modes/__tests__
              dist/pipeline/__tests__
              dist/planning/__tests__
              dist/scripts/__tests__
              dist/session-history/__tests__
              dist/subagents/__tests__
              dist/utils/__tests__
              dist/visual/__tests__
            catalog-check: true
          - node-version: 22
            lane: smoke
            catalog-check: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Download prebuilt dist artifact
        uses: actions/download-artifact@v8
        with:
          name: ci-dist-node20
          path: dist
      - name: Run grouped full-suite lane
        if: matrix.lane != 'smoke'
        run: |
          node dist/scripts/run-test-files.js ${{ matrix.test-roots }}
      - name: Verify generated catalog docs
        if: matrix.catalog-check == true
        run: node dist/scripts/generate-catalog-docs.js --check
      - name: Run cross-rebase smoke command
        if: matrix.lane == 'smoke'
        run: npm run test:team:cross-rebase-smoke:compiled
      - name: Run remaining smoke suite
        if: matrix.lane == 'smoke'
        run: |
          node --test \
            dist/cli/__tests__/packaged-script-resolution.test.js \
            dist/cli/__tests__/package-bin-contract.test.js \
            dist/cli/__tests__/explore.test.js \
            dist/cli/__tests__/sparkshell-cli.test.js \
            dist/hooks/__tests__/explore-routing.test.js \
            dist/hooks/__tests__/explore-sparkshell-guidance-contract.test.js \
            dist/scripts/__tests__/smoke-packed-install.test.js \
            dist/verification/__tests__/explore-harness-release-workflow.test.js \
            dist/compat/__tests__/*.test.js

  coverage-team-critical:
    name: Coverage Gate (Team Critical)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [typecheck, build-dist]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Download prebuilt dist artifact
        uses: actions/download-artifact@v8
        with:
          name: ci-dist-node20
          path: dist
      - name: Run team/state coverage gate
        run: npm run coverage:team-critical:compiled
      - name: Add coverage summary to job summary
        run: |
          node -e '
            const fs = require("node:fs");
            const summary = JSON.parse(fs.readFileSync("coverage/team/coverage-summary.json", "utf8"));
            const total = summary.total;
            const lines = [
              "## Team/State Coverage Summary",
              "",
              "| Metric | Pct | Covered / Total |",
              "|---|---:|---:|",
              `| Lines | ${total.lines.pct}% | ${total.lines.covered} / ${total.lines.total} |`,
              `| Functions | ${total.functions.pct}% | ${total.functions.covered} / ${total.functions.total} |`,
              `| Branches | ${total.branches.pct}% | ${total.branches.covered} / ${total.branches.total} |`,
              `| Statements | ${total.statements.pct}% | ${total.statements.covered} / ${total.statements.total} |`
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          '
      - name: Upload team coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-critical-coverage
          path: coverage/team/

  coverage-ts-full:
    name: Coverage Report (TypeScript Full)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [typecheck, build-dist]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Download prebuilt dist artifact
        uses: actions/download-artifact@v8
        with:
          name: ci-dist-node20
          path: dist
      - name: Run full TypeScript coverage report
        run: npm run coverage:ts:full:compiled
      - name: Add TypeScript coverage summary to job summary
        run: |
          node -e '
            const fs = require("node:fs");
            const summary = JSON.parse(fs.readFileSync("coverage/ts-full/coverage-summary.json", "utf8"));
            const total = summary.total;
            const lines = [
              "## Full TypeScript Coverage Summary",
              "",
              "| Metric | Pct | Covered / Total |",
              "|---|---:|---:|",
              `| Lines | ${total.lines.pct}% | ${total.lines.covered} / ${total.lines.total} |`,
              `| Functions | ${total.functions.pct}% | ${total.functions.covered} / ${total.functions.total} |`,
              `| Branches | ${total.branches.pct}% | ${total.branches.covered} / ${total.branches.total} |`,
              `| Statements | ${total.statements.pct}% | ${total.statements.covered} / ${total.statements.total} |`
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          '
      - name: Upload full TypeScript coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ts-full-coverage
          path: coverage/ts-full/

  coverage-rust:
    name: Coverage Report (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate Rust coverage reports
        shell: bash
        run: |
          mkdir -p coverage/rust

          cargo llvm-cov --workspace --summary-only | tee coverage/rust/rcs-explore-summary.txt
          cargo llvm-cov --workspace --lcov --output-path coverage/rust/rcs-explore.lcov

          cargo llvm-cov --manifest-path crates/rcs-sparkshell/Cargo.toml --summary-only | tee coverage/rust/rcs-sparkshell-summary.txt
          cargo llvm-cov --manifest-path crates/rcs-sparkshell/Cargo.toml --lcov --output-path coverage/rust/rcs-sparkshell.lcov
      - name: Add Rust coverage summary to job summary
        shell: bash
        run: |
          {
            echo '## Rust Coverage Summary'
            echo ''
            echo '### rcs-explore'
            echo '```text'
            cat coverage/rust/rcs-explore-summary.txt
            echo '```'
            echo ''
            echo '### rcs-sparkshell'
            echo '```text'
            cat coverage/rust/rcs-sparkshell-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Rust coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: coverage/rust/

  forge-persistence-gate:
    name: Forge Persistence Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [typecheck, build-dist]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Download prebuilt dist artifact
        uses: actions/download-artifact@v8
        with:
          name: ci-dist-node20
          path: dist
      - name: Run Forge persistence verification matrix
        run: npm run test:forge-persistence:compiled

  build:
    name: Build (Full Source Build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [rustfmt, clippy, lint, typecheck, build-dist, test, forge-persistence-gate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - run: npm ci
      - name: Download prebuilt dist artifact
        uses: actions/download-artifact@v8
        with:
          name: ci-dist-node20
          path: dist
      - run: npm run build:explore:release
      - run: npm run build:sparkshell

  ci-status:
    name: CI Status
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [rustfmt, clippy, lint, typecheck, test, coverage-team-critical, coverage-ts-full, coverage-rust, forge-persistence-gate, build]
    steps:
      - name: Generate CI proof artifact
        shell: bash
        env:
          GITHUB_SHA_VALUE: ${{ github.sha }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
          GITHUB_SERVER_URL_VALUE: ${{ github.server_url }}
          GITHUB_REPOSITORY_VALUE: ${{ github.repository }}
          RUSTFMT_RESULT: ${{ needs.rustfmt.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          COVERAGE_TEAM_CRITICAL_RESULT: ${{ needs.coverage-team-critical.result }}
          COVERAGE_TS_FULL_RESULT: ${{ needs.coverage-ts-full.result }}
          COVERAGE_RUST_RESULT: ${{ needs.coverage-rust.result }}
          FORGE_PERSISTENCE_GATE_RESULT: ${{ needs.forge-persistence-gate.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          mkdir -p ci-proof
          cat > ci-proof/final-ci-proof.md <<EOF
          # Final CI Proof

          Repository: \`${GITHUB_REPOSITORY_VALUE}\`
          Ref: \`${GITHUB_REF_VALUE}\`
          Commit: \`${GITHUB_SHA_VALUE}\`
          Run: ${GITHUB_SERVER_URL_VALUE}/${GITHUB_REPOSITORY_VALUE}/actions/runs/${GITHUB_RUN_ID_VALUE}/attempts/${GITHUB_RUN_ATTEMPT_VALUE}

          | Job | Result |
          | --- | --- |
          | rustfmt | \`${RUSTFMT_RESULT}\` |
          | clippy | \`${CLIPPY_RESULT}\` |
          | lint | \`${LINT_RESULT}\` |
          | typecheck | \`${TYPECHECK_RESULT}\` |
          | test | \`${TEST_RESULT}\` |
          | coverage-team-critical | \`${COVERAGE_TEAM_CRITICAL_RESULT}\` |
          | coverage-ts-full | \`${COVERAGE_TS_FULL_RESULT}\` |
          | coverage-rust | \`${COVERAGE_RUST_RESULT}\` |
          | forge-persistence-gate | \`${FORGE_PERSISTENCE_GATE_RESULT}\` |
          | build | \`${BUILD_RESULT}\` |
          EOF

          cat > ci-proof/final-ci-proof.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY_VALUE}",
            "ref": "${GITHUB_REF_VALUE}",
            "commit": "${GITHUB_SHA_VALUE}",
            "run_id": "${GITHUB_RUN_ID_VALUE}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT_VALUE}",
            "run_url": "${GITHUB_SERVER_URL_VALUE}/${GITHUB_REPOSITORY_VALUE}/actions/runs/${GITHUB_RUN_ID_VALUE}/attempts/${GITHUB_RUN_ATTEMPT_VALUE}",
            "jobs": {
              "rustfmt": "${RUSTFMT_RESULT}",
              "clippy": "${CLIPPY_RESULT}",
              "lint": "${LINT_RESULT}",
              "typecheck": "${TYPECHECK_RESULT}",
              "test": "${TEST_RESULT}",
              "coverage-team-critical": "${COVERAGE_TEAM_CRITICAL_RESULT}",
              "coverage-ts-full": "${COVERAGE_TS_FULL_RESULT}",
              "coverage-rust": "${COVERAGE_RUST_RESULT}",
              "forge-persistence-gate": "${FORGE_PERSISTENCE_GATE_RESULT}",
              "build": "${BUILD_RESULT}"
            }
          }
          EOF

          cat ci-proof/final-ci-proof.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload final CI proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-ci-proof
          path: ci-proof/
          if-no-files-found: error
      - name: Check required job results
        run: |
          if [[ "${{ needs.rustfmt.result }}" != "success" ]] ||
             [[ "${{ needs.clippy.result }}" != "success" ]] ||
             [[ "${{ needs.lint.result }}" != "success" ]] ||
             [[ "${{ needs.typecheck.result }}" != "success" ]] ||
             [[ "${{ needs.test.result }}" != "success" ]] ||
             [[ "${{ needs.coverage-team-critical.result }}" != "success" ]] ||
             [[ "${{ needs.coverage-ts-full.result }}" != "success" ]] ||
             [[ "${{ needs.coverage-rust.result }}" != "success" ]] ||
             [[ "${{ needs.forge-persistence-gate.result }}" != "success" ]] ||
             [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "::error::One or more required CI jobs failed"
            echo "  rustfmt: ${{ needs.rustfmt.result }}"
            echo "  clippy: ${{ needs.clippy.result }}"
            echo "  lint: ${{ needs.lint.result }}"
            echo "  typecheck: ${{ needs.typecheck.result }}"
            echo "  test: ${{ needs.test.result }}"
            echo "  coverage-team-critical: ${{ needs.coverage-team-critical.result }}"
            echo "  coverage-ts-full: ${{ needs.coverage-ts-full.result }}"
            echo "  coverage-rust: ${{ needs.coverage-rust.result }}"
            echo "  forge-persistence-gate: ${{ needs.forge-persistence-gate.result }}"
            echo "  build: ${{ needs.build.result }}"
            exit 1
          fi
          echo "All required CI checks passed"
