<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">RCS - Roblox Creator Skills</title>
  <desc id="desc">Roblox Studio workflow and runtime layer for Codex CLI with creator workflow stages and Roblox branding.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1480" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F1117"/>
      <stop offset="0.6" stop-color="#181C25"/>
      <stop offset="1" stop-color="#0B0D12"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="1050" y1="120" x2="1450" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF4B3E"/>
      <stop offset="1" stop-color="#E2231A"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1600" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="1310" cy="190" r="170" fill="url(#redGlow)" fill-opacity="0.18"/>
  <circle cx="1480" cy="700" r="220" fill="#E2231A" fill-opacity="0.08"/>
  <rect x="72" y="72" width="1456" height="756" rx="30" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="108" y="110" width="1384" height="680" rx="28" fill="#11151D" fill-opacity="0.72"/>
  </g>

  <g opacity="0.95">
    <rect x="140" y="146" width="210" height="42" rx="21" fill="#E2231A" fill-opacity="0.14"/>
    <text x="245" y="173" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">ROBLOX CREATOR SKILLS</text>
  </g>

  <text x="140" y="292" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="104" font-weight="800">RCS</text>
  <text x="140" y="366" fill="#F2F4F8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="34" font-weight="600">Roblox Studio workflow and runtime layer for Codex CLI</text>
  <text x="140" y="426" fill="#B9C0CC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="26" font-weight="500">Brief. Blueprint. Forge. Crew. Verified creator workflows in Roblox-native terms.</text>

  <g>
    <rect x="140" y="492" width="180" height="52" rx="18" fill="#E2231A"/>
    <text x="230" y="525" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">$brief</text>

    <rect x="338" y="492" width="206" height="52" rx="18" fill="#202632"/>
    <text x="441" y="525" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">$blueprint</text>

    <rect x="562" y="492" width="176" height="52" rx="18" fill="#202632"/>
    <text x="650" y="525" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">$forge</text>

    <rect x="756" y="492" width="162" height="52" rx="18" fill="#202632"/>
    <text x="837" y="525" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">$crew</text>

    <rect x="936" y="492" width="212" height="52" rx="18" fill="#202632"/>
    <text x="1042" y="525" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">$autoforge</text>
  </g>

  <g opacity="0.92">
    <rect x="140" y="598" width="160" height="46" rx="14" fill="#191E28" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="220" y="628" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Codex CLI</text>

    <rect x="318" y="598" width="134" height="46" rx="14" fill="#191E28" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="385" y="628" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">gpt-5.5</text>

    <rect x="470" y="598" width="134" height="46" rx="14" fill="#191E28" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="537" y="628" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">gpt-5.4</text>

    <rect x="622" y="598" width="166" height="46" rx="14" fill="#191E28" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="705" y="628" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Spark lane</text>
  </g>

  <g transform="translate(1120 250) rotate(14 170 170)">
    <rect x="0" y="0" width="340" height="340" rx="42" fill="#E2231A"/>
    <rect x="112" y="112" width="116" height="116" rx="16" fill="#0F1117"/>
  </g>

  <text x="1410" y="648" fill="#F5F7FA" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="end">JustineDevs / roblox-ai-os</text>
  <text x="1410" y="684" fill="#B9C0CC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="end">Roblox-native planning, execution, and verification</text>
</svg>
